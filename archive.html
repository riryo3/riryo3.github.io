<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉庫 | リョータ</title>
<meta name="description" content="過去につくったWebアプリや作品を置いている、リョータの倉庫です。">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" type="image/png" href="favicon-final.png">
<link rel="apple-touch-icon" href="favicon-final.png">
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1d2433;
    --sub: #5b6578;
    --line: #dfe3ee;
    --accent: #3b6df0;
    --accent-soft: #e8eefe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131c;
      --card: #1a2030;
      --text: #eef1f8;
      --sub: #a3adc2;
      --line: #2b344a;
      --accent: #7ea2ff;
      --accent-soft: #232c45;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 16px 56px;
  }
  .back-nav {
    margin-bottom: 20px;
  }
  .back-nav a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .back-nav a:hover {
    text-decoration: underline;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: .04em; }
  .desc { color: var(--sub); font-size: .88rem; margin: 0; }
  .group { margin-top: 28px; }
  .group h2 {
    font-size: .8rem;
    color: var(--sub);
    letter-spacing: .08em;
    margin: 0 0 10px 4px;
  }
  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: all .2s ease;
  }
  .links a:hover, .links a:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: none;
  }
  .link-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .emoji-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: var(--accent-soft);
  }
  .link-content {
    flex: 1;
    min-width: 0;
  }
  .link-title {
    display: block;
    font-size: 1rem;
    line-height: 1.4;
  }
  .links small {
    display: block;
    font-weight: 400;
    color: var(--sub);
    font-size: .82rem;
    margin-top: 3px;
  }
  footer { text-align: center; color: var(--sub); font-size: .75rem; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <nav class="back-nav">
    <a href="index.html">← トップに戻る</a>
  </nav>

  <header>
    <h1>倉庫</h1>
    <p class="desc">過去につくったWebアプリや作品を置いています。</p>
  </header>

  <section class="group">
    <h2>過去につくったもの</h2>
    <ul class="links">
      <li>
        <a href="https://ryotakaraok.web.app/" target="_blank" rel="noopener">
          <span class="link-icon emoji-icon" aria-hidden="true">🎤</span>
          <div class="link-content">
            <span class="link-title">楽曲リスト</span>
            <small>過去の遺物をAIと再構成したレパートリー集</small>
          </div>
        </a>
      </li>
      <li>
        <a href="https://music-manager.ryota-softwares.workers.dev/" target="_blank" rel="noopener">
          <span class="link-icon emoji-icon" aria-hidden="true">🎵</span>
          <div class="link-content">
            <span class="link-title">Music Manager（サービス終了）</span>
            <small>POPOPOのサービス終了に伴い提供終了。現在は終了のお知らせのみ。</small>
          </div>
        </a>
      </li>
      <li>
        <a href="https://re-music-manager.ryota-softwares.workers.dev/" target="_blank" rel="noopener">
          <span class="link-icon emoji-icon" aria-hidden="true">🎵</span>
          <div class="link-content">
            <span class="link-title">楽曲申請 管理マネージャー</span>
            <small>J-WID・NexToneの楽曲情報を管理。JSON・CSV保存、絞り込み・一括編集に対応。</small>
          </div>
        </a>
      </li>
    </ul>
  </section>

  <footer>© リョータ</footer>
</main>
</body>
</html>
